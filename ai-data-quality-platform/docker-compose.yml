#     depends_on:
#       - db
#     env_file: .env
#     ports:
#       - "8501:8501"
#
# volumes:
#   pgdata:
#
# POINTS D'ATTENTION
# -------------------
# - Ne jamais commit `.env` — utilise `.env.example` pour documenter
#   les variables attendues sans exposer de vraies valeurs.
# - `docker compose up --build` pour tout lancer en une commande —
#   c'est exactement ce qu'un recruteur/évaluateur testera en premier.
